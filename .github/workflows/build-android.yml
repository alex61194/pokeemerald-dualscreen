name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ARM toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build host tools and generated headers
        run: |
          make -f make_tools.mk -j$(nproc)
          make NODEP=1 MODERN=1 generated

      - name: Apply SDL2 patch
        run: |
          cd android/SDL2 && git apply ../patches/sdl2-android-lifecycle.patch || true

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/SDL2/android-project/gradlew

      - name: Build Android Debug APK
        run: |
          bash android/SDL2/android-project/gradlew -p android assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-dualscreen-vertical
          path: android/app/build/outputs/apk/debug/app-debug.apk
